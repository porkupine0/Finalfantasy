<title>FF7 Remake Guide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Figtree:wght@400;600;700&display=swap" crossorigin>
<style>
:root{
  --bg:#eef3f1; --surface:#ffffff; --surface-2:#e2ebe7; --ink:#10201c; --muted:#53655f; --line:#cfdcd7;
  --accent:#0d8a63; --accent-ink:#ffffff; --mako:#0d8a63; --mako-bg:#d8f3e8;
  --warn:#a3410f; --warn-bg:#fde8dc; --gold:#8a6300; --gold-bg:#fbefcc; --blue:#2453a6; --blue-bg:#e1eafb;
  --violet:#6b3fa0; --violet-bg:#efe5fb;
  --shadow:0 1px 2px rgba(16,32,28,.06),0 6px 18px rgba(16,32,28,.07);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#08110f; --surface:#101e1a; --surface-2:#172a25; --ink:#e8f5f0; --muted:#9db3ab; --line:#25403a;
  --accent:#35e0a1; --accent-ink:#06120f; --mako:#35e0a1; --mako-bg:#0f3a2c;
  --warn:#ff9c6b; --warn-bg:#3b1d10; --gold:#f2c14e; --gold-bg:#3a2f10; --blue:#8fb4ff; --blue-bg:#16264a;
  --violet:#c7a2ff; --violet-bg:#2a1a42;
  --shadow:none;
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#08110f; --surface:#101e1a; --surface-2:#172a25; --ink:#e8f5f0; --muted:#9db3ab; --line:#25403a;
  --accent:#35e0a1; --accent-ink:#06120f; --mako:#35e0a1; --mako-bg:#0f3a2c;
  --warn:#ff9c6b; --warn-bg:#3b1d10; --gold:#f2c14e; --gold-bg:#3a2f10; --blue:#8fb4ff; --blue-bg:#16264a;
  --violet:#c7a2ff; --violet-bg:#2a1a42;
  --shadow:none;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Figtree",system-ui,sans-serif;padding-inline:16px;padding-block:18px 64px}
.wrap{max-width:680px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:"Cinzel",Georgia,serif;margin:0;text-wrap:balance;letter-spacing:.01em}
h1{font-size:24px;font-weight:700}
h2{font-size:19px;font-weight:700}
h3{font-size:15px;font-weight:700;color:var(--accent);font-family:"Figtree",system-ui,sans-serif;text-transform:uppercase;letter-spacing:.06em}
p{margin:0}
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{display:flex;align-items:center;gap:10px}
.logo svg{width:42px;height:42px;flex:none;border-radius:10px}
.sub{font-size:13px;color:var(--muted)}
.tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;position:sticky;top:0;z-index:5;background:var(--bg);padding-block:8px}
.tab{padding:9px 2px;border-radius:10px;font-size:14px}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
button,select,input{font:inherit;color:var(--ink)}
button{cursor:pointer;border-radius:10px;border:1px solid var(--line);background:var(--surface);padding:10px 14px;font-weight:600}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.small{padding:6px 10px;font-size:14px}
.ghost{background:transparent}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow)}
.hint{font-size:14px;color:var(--muted)}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opt{padding:6px 11px;border-radius:999px;font-size:14px}
.opt[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
input[type=search],select{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface)}

/* progress */
.bar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .25s}
.num{font-variant-numeric:tabular-nums}

/* chapters */
details.ch{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
details.ch[open]{border-color:var(--accent)}
details.ch>summary{list-style:none;cursor:pointer;padding:14px 16px;display:grid;grid-template-columns:auto 1fr auto;gap:4px 12px;align-items:center}
details.ch>summary::-webkit-details-marker{display:none}
.chno{font-family:"Cinzel",serif;font-weight:700;font-size:20px;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--mako-bg);color:var(--mako);grid-row:1 / 3}
.ch.done .chno{background:var(--accent);color:var(--accent-ink)}
.chtitle{font-weight:700}
.chmeta{font-size:13px;color:var(--muted);grid-column:2}
.chcount{grid-row:1 / 3;grid-column:3;font-size:13px;color:var(--muted);text-align:right}
.here{display:inline-block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;background:var(--gold-bg);color:var(--gold);border-radius:6px;padding:1px 6px;margin-left:6px;vertical-align:2px}
.chbody{padding:0 16px 16px;display:flex;flex-direction:column;gap:14px}
.story{font-size:15px;color:var(--muted);border-left:3px solid var(--line);padding-left:10px}
.callout{border-radius:10px;padding:10px 12px;font-size:14px;background:var(--warn-bg);color:var(--ink);border-left:4px solid var(--warn)}
.callout b{color:var(--warn)}
.callout.info{background:var(--blue-bg);border-left-color:var(--blue)}
.callout.info b{color:var(--blue)}
ul.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
li.item{display:grid;grid-template-columns:28px 1fr;gap:2px 10px;align-items:start;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--surface)}
li.item.got{background:var(--surface-2);border-color:transparent}
li.item.got .itxt{text-decoration:line-through;text-decoration-color:var(--muted);color:var(--muted)}
li.item input{width:22px;height:22px;margin:2px 0 0;accent-color:var(--accent);cursor:pointer}
.itxt{font-weight:600}
.inote{grid-column:2;font-size:13.5px;color:var(--muted)}
.tag{display:inline-block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;border-radius:6px;padding:1px 6px;margin-right:6px;vertical-align:1px}
.t-quest{background:var(--blue-bg);color:var(--blue)}
.t-disc{background:var(--violet-bg);color:var(--violet)}
.t-script{background:var(--gold-bg);color:var(--gold)}
.t-weapon{background:var(--warn-bg);color:var(--warn)}
.t-materia{background:var(--mako-bg);color:var(--mako)}
.t-gear{background:var(--surface-2);color:var(--ink)}
.t-miss{background:var(--warn);color:var(--surface)}
.t-boss{background:var(--ink);color:var(--bg)}
.t-colo{background:var(--gold-bg);color:var(--gold)}
.tips{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:15px}
.boss{border:1px dashed var(--line);border-radius:10px;padding:10px 12px;font-size:14.5px}
.boss b{font-family:"Cinzel",serif}

/* builds */
.char{display:flex;flex-direction:column;gap:10px}
.char h2{display:flex;align-items:center;gap:8px}
.role{font-family:"Figtree",sans-serif;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
table{width:100%;border-collapse:collapse;font-size:14.5px}
th,td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);white-space:nowrap}
.mat{display:flex;flex-wrap:wrap;gap:5px}
.mat span{font-size:13px;padding:2px 8px;border-radius:99px;background:var(--mako-bg);color:var(--mako);font-weight:600}
.mat span.pair{background:var(--violet-bg);color:var(--violet)}

/* tips */
.tipgrp{display:flex;flex-direction:column;gap:8px}
.tip{padding:10px 12px;border-radius:10px;background:var(--surface-2)}
.tip b{display:block;margin-bottom:2px}

.empty{text-align:center;color:var(--muted);padding:24px}
footer{font-size:13px;color:var(--muted);text-align:center}
[hidden]{display:none!important}
@media (max-width:420px){ .tab{font-size:13px} }
</style>
</head>
<body>
<div class="wrap">
  <header class="brand">
    <div class="logo">

const FILTERS = ["all","quest","miss","materia","weapon","script","disc","colo","gear"];

// ---------- state ----------
const KEY = "ff7r-guide-v1";
let state = load() || { got:{}, cur:2, open:{2:true}, tab:"walk", filter:"all", hideGot:false, theme:null };
function load(){ try{ const s = localStorage.getItem(KEY); return s ? JSON.parse(s) : null; }catch(e){ return null; } }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} }

const $ = s => document.querySelector(s);


function allItems(){ return [...CHAPTERS.map(c => c.items.map(i => ({i, c, y:false}))), ...YUFFIE.map(c => c.items.map(i => ({i, c, y:true})))].flat(); }

function itemHTML([id, tag, text, note]){
  const got = !!state.got[id];
  return `<li class="item${got ? " got" : ""}"><input type="checkbox" data-id="${id}" ${got ? "checked" : ""} aria-label="${text.replace(/<[^>]+>/g,"")}">
    <div class="itxt"><span class="tag t-${tag}">${TAGS[tag]}</span>${text}</div>${note ? `<div class="inote">${note}</div>` : ""}</li>`;
}

function chapterHTML(c, y){
  const key = (y ? "y" : "") + c.n;
  const total = c.items.length, got = c.items.filter(i => state.got[i[0]]).length;
  const isCur = !y && state.cur === c.n;
  const done = total > 0 && got === total;
  return `<details class="ch${done ? " done" : ""}" data-key="${key}" ${state.open[key] ? "open" : ""}>
    <summary><span class="chno">${c.n}</span><span class="chtitle">${c.t}${isCur ? '<span class="here">You are here</span>' : ""}</span>
      <span class="chmeta">${c.where}</span><span class="chcount num">${got}/${total}</span></summary>
    <div class="chbody">
      <p class="story">${c.story}</p>
      ${(c.callouts || []).map(([k, h, b]) => `<div class="callout ${k === "info" ? "info" : ""}"><b>${h}:</b> ${b}</div>`).join("")}
      ${total ? `<h3>Loot & checklist</h3><ul class="list">${c.items.map(itemHTML).join("")}</ul>` : ""}
      ${c.boss.length ? `<h3>Bosses</h3>${c.boss.map(([n, t]) => `<div class="boss"><b>${n}</b> — ${t}</div>`).join("")}` : ""}
      ${c.tips.length ? `<h3>Tips</h3><ul class="tips">${c.tips.map(t => `<li>${t}</li>`).join("")}</ul>` : ""}
    </div></details>`;
}

function renderWalk(){
  $("#walk").innerHTML = CHAPTERS.map(c => chapterHTML(c, false)).join("");
}
function renderYuffie(){
  $("#yuffie").innerHTML = `<div class="panel"><h2>INTERmission: Yuffie</h2><p class="hint">Two-chapter episode included with Intergrade. Yuffie throws her shuriken for ranged attacks, and casting an element changes her Ninjutsu element. Use Synergy with Sonon for linked attacks.</p></div>`
    + YUFFIE.map(c => chapterHTML(c, true)).join("");
}
function renderHunt(){
  $("#filters").innerHTML = FILTERS.map(f => `<button class="opt" data-f="${f}" aria-pressed="${state.filter === f}">${f === "all" ? "All" : TAGS[f]}</button>`).join("");
  $("#hideGot").checked = state.hideGot;
  const q = $("#q").value.trim().toLowerCase();
  const groups = [...CHAPTERS.map(c => [c, false]), ...YUFFIE.map(c => [c, true])].map(([c, y]) => {
    const rows = c.items.filter(([id, tag, text, note]) =>
      (state.filter === "all" || tag === state.filter) &&
      (!state.hideGot || !state.got[id]) &&
      (!q || (text + " " + (note || "")).toLowerCase().includes(q)));
    return rows.length ? `<div class="panel"><h3>${y ? "Yuffie Ch " : "Ch "}${c.n} · ${c.t}</h3><ul class="list">${rows.map(itemHTML).join("")}</ul></div>` : "";
  }).join("");
  // bosses are searchable too
  const bossHits = q ? [...CHAPTERS, ...YUFFIE].flatMap(c => c.boss.filter(([n, t]) => (n + " " + t).toLowerCase().includes(q)).map(([n, t]) => `<div class="boss"><b>${n}</b> (Ch ${c.n}): ${t}</div>`)).join("") : "";
  $("#huntList").innerHTML = (groups + (bossHits ? `<div class="panel"><h3>Bosses</h3>${bossHits}</div>` : "")) || `<div class="empty">Nothing left here 🎉</div>`;
}
function renderBuilds(){
  $("#builds").innerHTML = `<div class="panel"><h2>Materia to prioritize</h2><table><tbody>${MATERIA_PRIORITY.map(([m, w]) => `<tr><th style="white-space:normal;text-transform:none;font-size:14px;color:var(--ink)">${m}</th><td>${w}</td></tr>`).join("")}</tbody></table>
    <p class="hint">Purple tags in a build are linked pairs: put them in two linked slots.</p></div>`
  + BUILDS.map(b => `<section class="panel char"><h2>${b.who} <span class="role">${b.role}</span></h2>
    <table><thead><tr><th>When</th><th>Weapon, materia &amp; accessory</th></tr></thead><tbody>
    ${b.stages.map(([w, wp, m, acc]) => `<tr><td class="num" style="white-space:nowrap">${w}</td><td><b>${wp}</b><div class="mat" style="margin-top:6px">${m.split(", ").map(x => `<span class="${x.includes("+") ? "pair" : ""}">${x}</span>`).join("")}</div><div class="hint" style="margin-top:6px">Accessory: ${acc}</div></td></tr>`).join("")}
    </tbody></table>
    <ul class="tips">${b.notes.map(n => `<li>${n}</li>`).join("")}</ul></section>`).join("");
}
function renderTips(){
  $("#tips").innerHTML = TIPS.map(g => `<section class="panel"><h2>${g.h}</h2><div class="tipgrp">${g.items.map(([h, t]) => `<div class="tip"><b>${h}</b>${t}</div>`).join("")}</div></section>`).join("")
    + `<section class="panel"><h2>Hard Mode (later)</h2><p class="hint">Unlocks after Chapter 18. Saved for your next run: no items, MP only refills at benches, and it has the higher-volume manuscripts and the top Combat Simulator rewards (including Götterdämmerung).</p></section>`;
}
function renderTotals(){
  const all = allItems(), got = all.filter(x => state.got[x.i[0]]).length;
  $("#totNum").textContent = `${got} / ${all.length}`;
  $("#totBar").style.width = (all.length ? got / all.length * 100 : 0) + "%";
}
function renderCurSel(){
  $("#curCh").innerHTML = CHAPTERS.map(c => `<option value="${c.n}" ${state.cur === c.n ? "selected" : ""}>Ch ${c.n}</option>`).join("");
}
function setTab(t){
  state.tab = t; save();
  document.querySelectorAll(".tab").forEach(b => b.setAttribute("aria-selected", b.dataset.tab === t));
  document.querySelectorAll(".view").forEach(v => v.hidden = v.id !== t);
  if (t === "hunt") renderHunt();
  if (scrollY > 200) window.scrollTo({ top:0 });
}
function renderAll(){ renderCurSel(); renderWalk(); renderYuffie(); renderBuilds(); renderTips(); renderHunt(); renderTotals(); setTab(state.tab); }

function applyTheme(){ if (state.theme) document.documentElement.dataset.theme = state.theme; else delete document.documentElement.dataset.theme; }

// ---------- events ----------
document.addEventListener("change", e => {
  const id = e.target.dataset && e.target.dataset.id;
  if (id){
    if (e.target.checked) state.got[id] = 1; else delete state.got[id];
    save();
    // update every copy of this item, chapter counts, and totals without collapsing what's open
    document.querySelectorAll(`input[data-id="${id}"]`).forEach(i => { i.checked = e.target.checked; i.closest("li").classList.toggle("got", e.target.checked); });
    document.querySelectorAll("details.ch").forEach(d => {
      const ins = d.querySelectorAll("input[data-id]"), n = [...ins].filter(i => i.checked).length;
      d.querySelector(".chcount").textContent = `${n}/${ins.length}`;
      d.classList.toggle("done", ins.length > 0 && n === ins.length);
    });
    renderTotals();
  }
});
document.addEventListener("toggle", e => {
  const d = e.target; if (!d.matches || !d.matches("details.ch")) return;
  state.open[d.dataset.key] = d.open; save();
}, true);
document.querySelectorAll(".tab").forEach(b => b.addEventListener("click", () => setTab(b.dataset.tab)));
$("#curCh").addEventListener("change", e => {
  state.cur = +e.target.value; state.open[state.cur] = true; save();
  renderWalk(); setTab("walk");
  const el = document.querySelector(`details.ch[data-key="${state.cur}"]`); if (el) el.scrollIntoView({ behavior:"smooth", block:"start" });
});
$("#filters").addEventListener("click", e => { const f = e.target.dataset.f; if (f){ state.filter = f; save(); renderHunt(); } });
$("#q").addEventListener("input", renderHunt);
$("#hideGot").addEventListener("change", e => { state.hideGot = e.target.checked; save(); renderHunt(); });
$("#themeBtn").addEventListener("click", () => {
  const dark = state.theme ? state.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  state.theme = dark ? "light" : "dark"; save(); applyTheme();
});
$("#resetBtn").addEventListener("click", () => {
  if (confirm("Clear every checkbox and start over?")){ state.got = {}; save(); renderAll(); }
});

applyTheme();
renderAll();
if ("serviceWorker" in navigator && window.isSecureContext && location.protocol.startsWith("http")) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
</body>
</html>
